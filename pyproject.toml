[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "divergence-hunter"
version = "0.1.0a1"
description = "Local, evidence-driven regression localization for interactive applications"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.16,<1", "rich>=14,<15", "pydantic>=2.11,<3",
  "PyYAML>=6,<7", "numpy>=2,<3", "Pillow>=11,<13",
]

[project.optional-dependencies]
browser = ["playwright>=1.51,<2"]
pygame = ["pygame-ce>=2.5,<3"]
ml = ["scikit-learn>=1.6,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
divergence = "divergence.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/divergence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: requires installed Chromium", "integration: runs real application processes"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
