name: Release qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core (${{ matrix.os }}, Python ${{ matrix.python }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade "pip>=26.2" "setuptools>=83"
      - run: python -m pip install -e ".[dev,ml]"
      - run: python -m ruff check src tests tools
      - run: python -m pytest -q --junitxml=results/core.xml
      - run: python -m build
      - run: python tools/smoke_install.py --wheel dist/divergence_hunter-0.1.0a1-py3-none-any.whl --output .divergence/installed-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: results-${{ matrix.os }}-${{ matrix.python }}
          path: |
            results/core.xml
            .divergence/installed-smoke/installed-smoke.json
            .divergence/installed-smoke/*.log
          retention-days: 1
          if-no-files-found: warn
  browser:
    name: Browser (Linux, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade "pip>=26.2" "setuptools>=83"
      - run: python -m pip install -e ".[dev,browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q -m browser --junitxml=results/browser.xml
        env:
          RUN_BROWSER_TESTS: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: results-browser-linux
          path: results/browser.xml
          retention-days: 1
  release-gate:
    name: Release gate
    if: always()
    needs: [core, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      CORE_RESULT: ${{ needs.core.result }}
      BROWSER_RESULT: ${{ needs.browser.result }}
    steps:
      - run: test "$CORE_RESULT" = success && test "$BROWSER_RESULT" = success
