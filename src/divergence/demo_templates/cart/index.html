<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fieldwork — your basket</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f1eee6; color: #243c33; font: 16px system-ui, sans-serif; }
  header { padding: 24px 48px; border-bottom: 1px solid #d5dace; letter-spacing: .15em; font-weight: 700; }
  main { max-width: 800px; margin: 40px auto; padding: 0 32px; }
  h1 { font-size: 40px; margin: 8px 0 28px; font-weight: 500; }
  .eyebrow { text-transform: uppercase; font-size: 12px; letter-spacing: .16em; }
  article { display: flex; gap: 30px; align-items: center; padding: 24px; background: #fcfbf7; border-radius: 12px; }
  .product { width: 112px; height: 138px; background: #daaa6c; border: 12px solid #ce9858; border-left: 18px solid #385c4e; border-radius: 4px; }
  h2 { margin: 0 0 8px; font-size: 22px; }
  input { width: 72px; margin: 12px; padding: 8px; border: 1px solid #98a99e; border-radius: 4px; font: inherit; }
  .checkout { padding: 20px 24px; }
  button { padding: 12px 20px; border: 0; border-radius: 6px; background: #244e3e; color: white; font: inherit; cursor: pointer; }
  #coupon-status { margin-left: 16px; font-size: 14px; }
  .total { display: flex; justify-content: space-between; border-top: 1px solid #cbd3c8; margin-top: 24px; padding-top: 18px; font-size: 24px; }
  footer { margin-top: 28px; font-size: 12px; color: #65746b; }
</style>
<header>FIELDWORK / SUPPLY</header>
<main>
  <div class="eyebrow">Local demo store</div>
  <h1>Your basket</h1>
  <article>
    <div class="product" aria-hidden="true"></div>
    <div>
      <h2>The everyday notebook</h2>
      <div>Kraft cover · dotted pages · $25.00</div>
      <label for="quantity">Quantity</label><input id="quantity" type="number" min="1" max="10" value="1">
    </div>
  </article>
  <div class="checkout">
    <button id="apply-coupon" type="button">Apply WELCOME10</button>
    <span id="coupon-status" role="status">10% off your basket</span>
    <div class="total"><span>Total</span><output id="total" data-cents="2500">$25.00</output></div>
  </div>
  <footer>A regression-testing fixture. No payment, account, or network requests.</footer>
</main>
<script src="cart.js"></script>
</html>
